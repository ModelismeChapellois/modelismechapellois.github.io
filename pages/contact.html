<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Club de modélisme à La Chapelle-Saint-Ursin : buggy, piste extérieure, indoor, événements, agenda, galerie photos.">
    <title>Contact - Modélisme Chapellois</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
    <div id="navbar"></div>
</header>

<section class="contact-form-section">
    <h2>Demande de renseignements</h2>
    <p>Envoyez-nous votre message, nous vous répondrons rapidement.</p>

    <form id="contact-form">
        <label for="name">Nom :</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message :</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Envoyer</button>
    </form>

    <p id="form-status"></p>
</section>


<footer class="footer">
    <div class="footer-links">
        <a href="mailto:modelismechapellois@gmail.com">📧 Email</a>
        <a href="https://www.youtube.com/@Mod%C3%A9lismeChapellois" target="_blank">📺 YouTube</a>
        <a href="https://www.facebook.com/groups/modelismechapellois" target="_blank">📘 Facebook</a>
        <a href="https://www.instagram.com/modelismechapellois" target="_blank">📸 Instagram</a>
        <a href="https://www.tiktok.com/@modelismechapellois" target="_blank">🎵 TikTok</a>
    </div>

    <p>© 2026 Modélisme Chapellois</p>
</footer>
<script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
</script>

<script>
    (function(){
        emailjs.init("1xW3O80_tez0lSg8m");
    })();

    document.getElementById("contact-form").addEventListener("submit", function(event){
        event.preventDefault();

        emailjs.send("service_kbgxqz7", "template_em4vgko", {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            message: document.getElementById("message").value
        })
        .then(function() {
            document.getElementById("form-status").innerText = "Message envoyé avec succès !";
            document.getElementById("contact-form").reset();
        }, function(error) {
            document.getElementById("form-status").innerText = "Erreur lors de l'envoi.";
        });
    });
</script>


</body>
<script>
    fetch("../header.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar").innerHTML = data;
        });
</script>
</html>
